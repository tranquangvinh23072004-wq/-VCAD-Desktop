
name: Build and publish VC@D Windows update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vcad-auto-release
  cancel-in-progress: false

jobs:
  build-and-publish-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check version and skip if already released
        id: release
        shell: pwsh
        run: |
          $projectDir = "."
          $packagePath = Join-Path $projectDir "package.json"

          if (-not (Test-Path $packagePath)) {
            throw "Không tìm thấy package.json tại thư mục gốc repository."
          }

          $package = Get-Content $packagePath -Raw | ConvertFrom-Json

          if ($package.version -notmatch '^\d+\.\d+\.\d+$') {
            throw "version phải có dạng X.Y.Z, hiện tại: $($package.version)"
          }

          $tag = "v$($package.version)"

          git fetch --tags origin
          if ($LASTEXITCODE -ne 0) {
            throw "Không lấy được danh sách tag từ GitHub."
          }

          $existingTag = git tag --list $tag

          "version=$($package.version)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          if ($existingTag) {
            "should_release=false" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $tag đã tồn tại. Bỏ qua phát hành trùng version."
          } else {
            "should_release=true" >> $env:GITHUB_OUTPUT
            Write-Host "Sẽ build và phát hành $tag."
          }

      - name: Download local frontend vendor files
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $vendorScript = Join-Path "." "download-vendor.ps1"

          if (-not (Test-Path $vendorScript)) {
            throw "Không tìm thấy download-vendor.ps1 tại thư mục gốc repository."
          }

          & $vendorScript

          if (-not $?) {
            throw "Tải thư viện giao diện thất bại."
          }

      - name: Install Node dependencies
        if: steps.release.outputs.should_release == 'true'
        run: npm install --no-audit --no-fund

      - name: Build Windows installer and publish update assets
        if: steps.release.outputs.should_release == 'true'
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
